<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00335e">
  <title>Inventory Custodian Slip | SPIS</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #172033; background: #edf2f7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 18px; background: radial-gradient(circle at 12% 0%, #dce9f5 0, transparent 32rem), #edf2f7; }
    main { width: min(1180px, 100%); margin: 0 auto; }
    .paper { position: relative; overflow: hidden; background: #fff; border: 1px solid #d7e0e9; border-radius: 16px; box-shadow: 0 20px 55px #1535531a, 0 3px 10px #1535530b; padding: 34px; }
    .paper::before { position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg, #00335e, #087d91 65%, #75b6a3); content: ""; }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .brand { color: #62758a; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 0; color: #07365d; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.025em; }
    .document-badge { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; margin-top: 4px; padding: 9px 12px; border: 1px solid #c8ddeb; border-radius: 999px; background: #f2f8fc; color: #164568; font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .document-badge::before { width: 7px; height: 7px; border-radius: 50%; background: #168478; content: ""; }
    .metadata { display: grid; grid-template-columns: 1.35fr .8fr 1fr; gap: 12px; margin-bottom: 22px; }
    .meta-card { min-width: 0; padding: 15px 16px; border: 1px solid #dce5ed; border-radius: 10px; background: linear-gradient(180deg, #fff, #fbfdff); box-shadow: 0 2px 5px #18385208; }
    .label { display: block; margin-bottom: 7px; color: #65788d; font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .value { overflow-wrap: anywhere; color: #182d42; font-size: 14px; font-weight: 700; line-height: 1.45; }
    .table-wrap { overflow-x: auto; border: 1px solid #d7e0e9; border-radius: 10px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    th, td { border-bottom: 1px solid #e5ebf0; padding: 11px 10px; text-align: left; vertical-align: top; }
    th { background: #07365d; color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .055em; text-transform: uppercase; white-space: nowrap; }
    th:first-child { border-radius: 8px 0 0; }
    th:last-child { border-radius: 0 8px 0 0; }
    tbody tr:nth-child(even) { background: #f7fafc; }
    tbody tr:hover { background: #eff6fa; }
    tbody tr:last-child td { border-bottom: 0; }
    .numeric { color: #173b5a; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; white-space: nowrap; }
    .description { min-width: 220px; color: #1c2e40; font-weight: 600; }
    .description small { display: block; margin-top: 6px; color: #62758a; font-size: 11px; font-weight: 400; line-height: 1.55; white-space: pre-line; }
    .signatories { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .signatory { min-height: 112px; padding: 16px 18px; border: 1px solid #dce5ed; border-radius: 10px; background: #fbfdff; }
    .signatory strong { display: block; min-height: 19px; margin-top: 22px; padding-top: 9px; border-top: 1px solid #9aaabd; color: #1b3043; font-size: 13px; }
    .signatory small { display: block; margin-top: 6px; color: #65788d; font-size: 11px; line-height: 1.5; }
    .state { padding: 54px 18px; color: #53677b; font-size: 14px; font-weight: 600; text-align: center; }
    .state.error { color: #9f2630; }
    @media (max-width: 760px) { body { padding: 18px 10px; } .paper { padding: 26px 18px; } .metadata { grid-template-columns: 1fr 1fr; } .metadata .meta-card:first-child { grid-column: 1 / -1; } }
    @media (max-width: 540px) { .card-header { flex-direction: column; gap: 12px; } .document-badge { margin: 0; } .metadata { grid-template-columns: 1fr; } .metadata .meta-card:first-child { grid-column: auto; } .signatories { grid-template-columns: 1fr; } .paper { padding: 23px 14px; } }
    @media print { :root { background: #fff; } body { padding: 0; background: #fff; } main { width: 100%; } .paper { border: 0; border-radius: 0; box-shadow: none; padding: 8mm; } .paper::before { display: none; } tbody tr:hover { background: transparent; } }
  </style>
</head>
<body>
  <main>
    <section class="paper" aria-live="polite">
      <div id="loadingState" class="state">Loading Inventory Custodian Slip…</div>
      <div id="icsContent" hidden>
        <header class="card-header">
          <div><div class="brand">School Property Information System</div><h1>Inventory Custodian Slip</h1></div>
          <span class="document-badge">Official Record</span>
        </header>
        <section class="metadata" aria-label="Slip details">
          <div class="meta-card"><span class="label">Entity Name</span><span class="value" id="entityName"></span></div>
          <div class="meta-card"><span class="label">Fund Cluster</span><span class="value" id="fundCluster"></span></div>
          <div class="meta-card"><span class="label">ICS No.</span><span class="value" id="icsNo"></span></div>
        </section>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Qty</th><th>Unit</th><th>Unit Cost</th><th>Total Cost</th><th>Description</th><th>Inventory Item No.</th><th>Estimated Useful Life</th></tr></thead>
            <tbody id="itemRows"></tbody>
          </table>
        </div>
        <section class="signatories" aria-label="Received from and received by">
          <div class="signatory"><span class="label">Received From</span><strong id="receivedFrom"></strong><small id="receivedFromDetails"></small></div>
          <div class="signatory"><span class="label">Received By</span><strong id="receivedBy"></strong><small id="receivedByDetails"></small></div>
        </section>
      </div>
    </section>
  </main>
  <script src="supabase-config.js?v=20260922"></script>
  <script src="js/ics-view.js?v=20261103_2"></script>
</body>
</html>
