<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Issuance Years</title>
  <link rel="stylesheet" href="css/accountable-person-report.css">
</head>
<body>
  <main>
    <div class="top-nav">
      <a href="index.html" class="back-link">&larr; Back to Dashboard</a>
    </div>
    <header>
      <div>
        <h1>All Issuance Years</h1>
        <p>Asset issuance records pulled from the database</p>
      </div>
      <div id="totalAssigned" class="total">Loading...</div>
    </header>
    <div class="controls-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search issuance year (e.g. 2024)..." autocomplete="off">
      </div>
      <div class="filter-box">
        <select id="typeFilter">
          <option value="all">All Items</option>
          <option value="buildings">Buildings</option>
          <option value="inventory">Inventory</option>
        </select>
      </div>
    </div>
    <section id="issuanceYearChart" class="chart" aria-label="All issuance years">
      <p class="loading-state">Connecting to database and pulling issuance records...</p>
    </section>
    <nav class="pagination" aria-label="Issuance year pages">
      <button id="previousPage" type="button">Previous</button>
      <span id="pageStatus" aria-live="polite"></span>
      <button id="nextPage" type="button">Next</button>
    </nav>
  </main>
  <script src="supabase-config.js?v=20260904"></script>
  <script src="js/issuance-year-report.js?v=20260914"></script>
</body>
</html>
